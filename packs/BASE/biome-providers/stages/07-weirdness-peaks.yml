# Weirdness (ridges) splits meadow mountain biomes into peak variants.
# High weirdness = peaks, low weirdness = valleys remain meadow.
# Frozen and cold peaks are already resolved in earlier humidity stages.
# This stage only operates on temperate/warm/hot mountain placeholders
# that resolved to MEADOW.

stage-type: REPLACE_LIST
sampler: weirdness
from:
  MEADOW:
    - MEADOW: 5
    - STONY_PEAKS: 5
