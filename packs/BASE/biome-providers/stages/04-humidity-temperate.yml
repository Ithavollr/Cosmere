# Humidity splits for temperate temperature band across all elevations.

type: REPLACE_LIST
sampler: humidity
from:
  flat-temperate:
    - PLAINS: 3
    - FOREST: 3
    - BIRCH_FOREST: 2
    - DARK_FOREST: 1
    - SWAMP: 1

  hills-temperate:
    - WINDSWEPT_HILLS: 5
    - FOREST: 3
    - PLAINS: 2

  mountains-temperate:
    # Temperate mountains resolve to meadow by default;
    # weirdness stage later splits meadow into peaks.
    - MEADOW: 10
