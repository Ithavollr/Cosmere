# Fine-tuning stage: adjacency-based and noise-driven biome replacements applied
# after all primary stratification (temperature, humidity, weirdness) is resolved.
#
# All biomes entering this stage are final, so terra: tags declared in biome YAMLs
# are available for BORDER/BORDER_LIST matching.
#
# Tag conventions used here:
#   terra:rugged  — hills and peaks biomes (WINDSWEPT_HILLS, WINDSWEPT_GRAVELLY_HILLS,
#                   JAGGED_PEAKS, STONY_PEAKS, FROZEN_PEAKS)
#   terra:beach   — sandy/snowy beach biomes (BEACH, SNOWY_BEACH)
#
# Future replacements (variant biomes, specialty biomes) should be added below
# as additional BORDER, BORDER_LIST, or REPLACE_LIST entries.

type: BORDER
sampler: whiteNoise
# Any terra:beach cell that borders a terra:rugged cell becomes STONY_SHORE.
from: terra:rugged
replace: terra:beach
to:
  - STONY_SHORE: 1
