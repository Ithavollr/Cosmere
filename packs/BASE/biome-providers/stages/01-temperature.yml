# Split all continentalness tiers by temperature simultaneously.
# Temperature is a separate vanilla noise parameter (-1.0 frozen, +1.0 hot).
# Deep oceans have 4 temperature variants (no deep warm ocean in vanilla 1.21).
# Shallow oceans and all land tiers have 5 temperature variants.

type: REPLACE_LIST
sampler: temperature
from:
  DEEP_OCEAN:
    # Vanilla 1.21 has 4 deep ocean variants (no deep warm ocean)
    - DEEP_FROZEN_OCEAN: 25
    - DEEP_COLD_OCEAN: 25
    - DEEP_OCEAN: 25
    - DEEP_LUKEWARM_OCEAN: 25

  OCEAN:
    # 5 shallow ocean temperature variants
    - FROZEN_OCEAN: 20
    - COLD_OCEAN: 20
    - OCEAN: 20
    - LUKEWARM_OCEAN: 20
    - WARM_OCEAN: 20

  COAST:
    # Coast resolves to beach biomes by temperature.
    # Stony shore placement is handled by the fine-tuning BORDER stage.
    - SNOWY_BEACH: 20
    - BEACH: 80

  LAND_FLAT:
    - flat-frozen: 15
    - flat-cold: 20
    - flat-temperate: 30
    - flat-warm: 20
    - flat-hot: 15

  LAND_HILLS:
    - hills-frozen: 15
    - hills-cold: 20
    - hills-temperate: 30
    - hills-warm: 20
    - hills-hot: 15

  LAND_MOUNTAINS:
    - mountains-frozen: 15
    - mountains-cold: 20
    - mountains-temperate: 30
    - mountains-warm: 20
    - mountains-hot: 15
