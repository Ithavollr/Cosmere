id: VANILLA_PIPELINE
type: PIPELINE
resolution: 4

pipeline:
  source:
    type: SAMPLER
    sampler: continental
    biomes:
      # Continentalness drives both ocean depth and land elevation.
      # Most negative continentalness = deepest ocean / mushroom islands.
      # Most positive continentalness = highest mountains.
      # Weights are slice widths across the normalized noise range.
      - MUSHROOM_FIELDS: 3  # Most negative: rare mushroom island outcrops in deep ocean
      - DEEP_OCEAN: 27      # Very negative continentalness
      - OCEAN: 15           # Moderately negative
      - COAST: 10           # Near-zero: beaches and stony shores
      - LAND_FLAT: 20       # Low positive (plains, forests)
      - LAND_HILLS: 20      # Medium positive (windswept hills)
      - LAND_MOUNTAINS: 5   # High positive (meadows, peaks)
  stages:
    # Temperature stage
    - << biome-providers/stages/01-temperature.yml:stages
    # Humidity stages for each temperature tier
    - << biome-providers/stages/02-humidity-frozen.yml:stages
    - << biome-providers/stages/03-humidity-cold.yml:stages
    - << biome-providers/stages/04-humidity-temperate.yml:stages
    - << biome-providers/stages/05-humidity-warm.yml:stages
    - << biome-providers/stages/06-humidity-hot.yml:stages
    # Weirdness peaks stage
    - << biome-providers/stages/07-weirdness-peaks.yml:stages
    # Fine-tuning stage
    - << biome-providers/stages/08-fine-tuning.yml:stages
